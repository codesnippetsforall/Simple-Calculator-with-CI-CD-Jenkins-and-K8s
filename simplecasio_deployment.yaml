apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplecasio-deployment
  labels: 
    app: simplecasio_deploy_lbl
  namespace: default
spec:
  replicas: 3
  strategy: 
    type: RollingUpdate
  selector: 
    matchLabels:
      app: simplecasio_lbl
  template:
    metadata:
      labels: 
        app: simplecasio_lbl
    spec:
      containers:
        - name: simplecasiocntr
          image: dockermano1984/simplecasioimg:1.1
          #image: dockermano1984/simplecasioimg:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            
---

apiVersion: v1
kind: Service
metadata:
  name: simplecasiopod-service
  labels: 
    app: simplecasio_lbl
spec:
  type: NodePort
  selector:
    app: simplecasio_lbl
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30060